# Randomized regions and item group types, for manual play verification.
# Per seed: chores keeps 3 of 7 candidates (Dust has Count 2), fitness keeps 50% of 4 = 2,
# gems keeps 2 of 4. Final: 9 tasks, 9 items (balanced).
# Goal: "Final review" && ("Run" || "Yoga"); one of Run / Yoga is always kept.
# Item groups: keys progressive (x3), gems random-choice, snacks aesthetic (default 50% = 2 of 3).
name: Randomize Test
game: Taskipelago
description: Randomized regions and item group types
